name: Temporary targeted paper recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/paper-recovery.yml'
      - 'tools/paper_recovery/**'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -U requests beautifulsoup4 pymupdf pymupdf4llm playwright
          python -m playwright install --with-deps chromium
      - name: Recover targeted papers
        run: python tools/paper_recovery/recover.py
      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: targeted-paper-recovery
          path: recovery_output
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
