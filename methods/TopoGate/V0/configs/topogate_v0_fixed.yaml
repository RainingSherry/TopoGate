# TopoGate V0 / scVICAR-F. This is the old NeighborMix parameterization
# expressed through the shared V0 runner.
protocol_id: topogate_v0_scvicar_v1
parameterization: fixed
hidden_size: 128
epochs: 80
batch_size: 256
lr: 0.001
mask_ratio: 0.4
dropout: 0.0
masked_data_weight: 0.75
mask_loss_weight: 0.7
use_pseudo: true
pseudo_weight: 0.3
alpha: 0.9
neighbor_k: 5
mix_neighbors: 4
neighbor_estimator: current
drop_last: true
knn_pca_dim: 50
tau: 0.2
edge_reliability_mode: sim_mutual_snn_distance
gate_min: 0.0
gate_max: 0.15
n_top_features: 1000
target_sum: 10000.0
input_mode: auto
scale_input: true
