# TopoGate V0 / scVICAR-T. This is the old reliability-guided NeighborMix
# parameterization expressed through the shared V0 runner.
protocol_id: topogate_v0_scvicar_v1
parameterization: topology
hidden_size: 128
epochs: 80
batch_size: 256
lr: 0.001
mask_ratio: 0.4
dropout: 0.0
masked_data_weight: 0.75
mask_loss_weight: 0.7
use_pseudo: true
pseudo_weight: 0.3
alpha: 0.9
neighbor_k: 10
mix_neighbors: 4
neighbor_estimator: current
knn_pca_dim: 50
tau: 0.2
edge_reliability_mode: sim_mutual_snn_distance
gamma_sim: 1.0
gamma_mutual: 1.0
gamma_snn: 1.0
gamma_distance: 1.0
gate_min: 0.0
gate_max: 0.15
beta_mutual: 1.0
beta_snn: 1.0
beta_perturb: 2.0
beta_uncertainty: 1.0
n_top_features: 1000
target_sum: 10000.0
input_mode: auto
scale_input: true
