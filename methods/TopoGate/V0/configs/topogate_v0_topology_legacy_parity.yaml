# Strict replay of the retired RG_NeighborMix-scMAE T runner.  This file is only
# for scripts/V0/run_legacy_parity.py; normal V0 and CLUBench use their own
# resolved configs and keep rng_protocol=isolated_v0.
protocol_id: topogate_v0_legacy_parity_v1
parameterization: topology
rng_protocol: legacy_plantnet
hidden_size: 128
epochs: 80
batch_size: 256
lr: 0.001
mask_ratio: 0.4
dropout: 0.0
masked_data_weight: 0.75
mask_loss_weight: 0.7
use_pseudo: true
pseudo_weight: 0.3
alpha: 0.9
neighbor_k: 10
mix_neighbors: 4
neighbor_estimator: current
drop_last: false
knn_pca_dim: 50
tau: 0.2
edge_reliability_mode: sim_mutual_snn_distance
gamma_sim: 1.0
gamma_mutual: 1.0
gamma_snn: 1.0
gamma_distance: 1.0
gate_min: 0.0
gate_max: 0.15
beta_mutual: 1.0
beta_snn: 1.0
beta_perturb: 2.0
beta_uncertainty: 1.0
input_mode: raw
n_top_features: 1000
target_sum: 10000.0
scale_input: true
kmeans_n_init: 20
